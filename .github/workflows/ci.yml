name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Rescan the full history weekly, so new secret rules also apply to old commits.
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mealie-mc-bridge

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The gitleaks action scans commit ranges and fails on pushes that start at the root
      # commit, so the binary scans the whole history on every run instead.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$archive" "$base/$archive"
          curl -sSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" checksums.txt gitleaks
      - name: Scan the whole history
        run: gitleaks detect --source . --no-banner --redact --exit-code 1

  # Builds the image on pull requests so a broken Dockerfile shows up before the merge.
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: mealie-mc-bridge:ci
          cache-from: type=gha
      # Starts the image with throwaway settings: the native modules load, migrations run
      # on the volume and /health answers.
      - name: Check /health of the image
        run: |
          docker run -d --name bridge -p 127.0.0.1:3000:3000 \
            -e WEBHOOK_TOKEN="$(openssl rand -hex 32)" \
            -e SETTINGS_KEY="$(openssl rand -base64 32)" \
            -e MEALIE_URL=http://127.0.0.1:9 \
            -e MEALIE_API_TOKEN=ci-placeholder \
            mealie-mc-bridge:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then
              docker stop bridge >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs bridge
          exit 1
      # The automatic login needs Chromium to start as the unprivileged bridge user, through
      # the bridge's own adapter: its availability probe must pass, and a persistent profile
      # must open and close.
      - name: Check the headless browser of the image
        run: |
          docker run --rm mealie-mc-bridge:ci node --input-type=module -e "
            const { PlaywrightBrowser } = await import('/app/dist/session/playwright-browser.js');
            const browser = new PlaywrightBrowser();
            const problem = await browser.unavailable();
            if (problem !== null) { console.error('browser unavailable: ' + problem); process.exit(1); }
            const context = await browser.open({ profileDir: '/tmp/ci-profile', headless: true });
            await context.page.goto('data:text/html,<title>ok</title>');
            await context.close();
            console.log('adapter ok as uid ' + process.getuid());
          "
          docker image ls mealie-mc-bridge:ci

  # Publishes only after format, lint, typecheck, tests, build and the secret scan passed.
  publish:
    if: github.event_name == 'push'
    needs: [check, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
