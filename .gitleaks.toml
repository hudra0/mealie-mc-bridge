title = "mealie-mc-bridge"

[extend]
useDefault = true

# The Monsieur Cuisine session is a pair of cookies. The default rules do not
# know their names or the WordPress cookie value format.

[[rules]]
id = "mc-wordpress-cookie-name"
description = "WordPress login cookie with a value"
regex = '''wordpress_logged_in_[0-9a-f]{32}["']?\s*[=:,]\s*["']?[^\s"']{20,}'''
keywords = ["wordpress_logged_in_"]

[[rules]]
id = "mc-wordpress-cookie-value"
description = "WordPress login cookie value (user|expiry|token|hmac)"
regex = '''[^|\s"'%]+(\||%7C)\d{10}(\||%7C)[A-Za-z0-9]{43}(\||%7C)[0-9a-f]{64}'''

[[rules]]
id = "mc-lidl-sso-token"
description = "Lidl SSO id token cookie with a value"
regex = '''lidl_sso_id_token["']?\s*[=:,]\s*["']?[A-Za-z0-9_\-.]{20,}'''
keywords = ["lidl_sso_id_token"]

[[rules]]
id = "mc-private-network-address"
description = "Private network address (RFC 1918)"
regex = '''\b(10\.\d{1,3}|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'''
