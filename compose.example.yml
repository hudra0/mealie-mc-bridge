services:
  mc-bridge:
    image: ghcr.io/hudra0/mealie-mc-bridge:latest
    # To build the image yourself instead of pulling it, replace the image line with:
    # build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # A named volume inherits the ownership of /data from the image, so the
      # non-root user can write to it. For a bind mount (./data:/data) run
      # `mkdir -p data && sudo chown 1000:1000 data` first.
      - bridge-data:/data

volumes:
  bridge-data:
