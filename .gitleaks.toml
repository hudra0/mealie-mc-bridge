title = "mealie-mc-bridge"

[extend]
useDefault = true

# The synthetic leaks that prove the rules below fire (scripts/gitleaks-rules.test.ts runs
# gitleaks on them with this block removed).
# fixtures-allowlist:start
[[allowlists]]
description = "Synthetic fixtures of the gitleaks rule test"
paths = ['''^test/fixtures/gitleaks/''']
# fixtures-allowlist:end

# The Monsieur Cuisine session is a pair of cookies. The default rules do not
# know their names or the WordPress cookie value format.

[[rules]]
id = "mc-wordpress-cookie-name"
description = "WordPress login cookie with a value"
regex = '''wordpress_(?:logged_in|sec)_[0-9a-f]{32}["']?\s*[=:,]\s*["']?[^\s"']{20,}'''
keywords = ["wordpress_logged_in_", "wordpress_sec_"]

[[rules]]
id = "mc-wordpress-cookie-value"
description = "WordPress login cookie value (user|expiry|token|hmac)"
regex = '''[^|\s"'%]+(\||%7C)\d{10}(\||%7C)[A-Za-z0-9]{43}(\||%7C)[0-9a-f]{64}'''

[[rules]]
id = "mc-lidl-sso-token"
description = "Lidl SSO id token cookie with a value"
regex = '''lidl_sso_id_token["']?\s*[=:,]\s*["']?[A-Za-z0-9_\-.]{20,}'''
keywords = ["lidl_sso_id_token"]

[[rules]]
id = "mc-private-network-address"
description = "Private network address (RFC 1918)"
regex = '''\b(10\.\d{1,3}|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'''

# SMTP_URL carries the mail password in its user info. Documentation uses example.com
# hosts and placeholders, which stay allowed.
[[rules]]
id = "mc-smtp-url-credentials"
description = "SMTP URL with a user name and a password"
regex = '''smtps?://[^:/\s@"'<>]+:[^@\s"'<>$]+@[A-Za-z0-9.-]+'''
keywords = ["smtp://", "smtps://"]

[[rules.allowlists]]
description = "Example hosts"
regexTarget = "match"
regexes = ['''@(?:[A-Za-z0-9-]+\.)*example\.(?:com|org|net)$''']

# The secret settings of the bridge with a value, whatever their entropy. Empty values (as
# in .env.example), shell substitutions and placeholders in angle brackets do not match.
[[rules]]
id = "mc-env-secret"
description = "Secret setting of the bridge with a value"
regex = '''\b(?:OPENAI_API_KEY|ANTHROPIC_API_KEY|MEALIE_API_TOKEN|WEBHOOK_TOKEN|SETTINGS_KEY|ADMIN_PASSWORD|MC_COOKIE)[ \t]*=[ \t]*["']?[^\s"'$<{#\\][^\s"']{7,}'''
keywords = [
  "openai_api_key",
  "anthropic_api_key",
  "mealie_api_token",
  "webhook_token",
  "settings_key",
  "admin_password",
  "mc_cookie",
]

[[rules.allowlists]]
description = "Obvious placeholders"
regexTarget = "match"
regexes = ['''(?i)=[ \t]*["']?(?:ci-placeholder|placeholder|changeme|example|your-|x{8,})''']
