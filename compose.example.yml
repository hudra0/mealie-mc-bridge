# Copy to compose.yml next to a filled-in .env (from .env.example). Mealie posts to the bridge
# and the bridge calls Mealie, so both must share a Docker network. Two ways:
# - Paste the mc-bridge service into Mealie's compose file and keep data/ next to that file.
#   Name the settings file mc-bridge.env there and point env_file at it, so it does not
#   collide with a .env of Mealie's project. The networks lines below stay commented out.
# - Keep this as its own compose project and join Mealie's network: uncomment both networks
#   blocks and set the name to Mealie's network (`docker network ls`; usually
#   <mealie project directory>_default).
services:
  mc-bridge:
    image: ghcr.io/hudra0/mealie-mc-bridge:latest
    # latest follows main. To pin a build, use its sha-<commit> tag or a release tag (X.Y or
    # X.Y.Z); to fix the exact image, add its digest: mealie-mc-bridge:X.Y.Z@sha256:<digest>.
    # To build the image yourself from a clone of the repository, replace the image line with
    # the path of the clone:
    # build: .
    restart: unless-stopped
    # Hardening. The image's entrypoint (tini) reaps the processes a crashed browser leaves;
    # init: true does the same for an image built without it. The bridge writes only to
    # /data; the browser of the automatic login writes to /tmp and the home directory, which
    # live in memory here.
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /home/bridge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # Node.js and a headless Chromium during a login; raise it if the log shows the
    # container being killed.
    mem_limit: 1g
    # Every setting comes from .env; README.md has the full reference.
    env_file: .env
    # The admin pages and /health. Mealie reaches the webhook over the Docker network as
    # http://mc-bridge:3000, so the host port only needs to be open for you. As written it
    # answers on this machine only. To reach the admin pages from other machines, put a
    # reverse proxy with TLS in front (README, "Security") rather than opening the port;
    # the admin password, the session cookie and the Lidl password cross the network in plain
    # text otherwise. Never publish it on the internet.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # bridge.db lives here. The container runs as uid 1000, so create the directory
      # first: mkdir -p data && sudo chown 1000:1000 data
      - ./data:/data
    # Give a running job time to finish a Monsieur Cuisine request (up to 30 s) or hand
    # itself back to the queue on shutdown.
    stop_grace_period: 45s
    # networks:
    #   - mealie

  # Mealie in the same compose project, shortened to the one line the bridge needs. From
  # 3.26 on, Mealie refuses to post to private addresses that are not on its allow list,
  # and the recipe action then fails without a message. The value is the bridge's service
  # name, without scheme or port. Add it to your existing Mealie service:
  # mealie:
  #   image: ghcr.io/mealie-recipes/mealie:latest
  #   environment:
  #     HTTP_ALLOW_LIST: "mc-bridge"

